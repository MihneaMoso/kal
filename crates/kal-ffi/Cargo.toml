[package]
name = "kal-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stable C ABI for Kal's Rust core, consumed by native widget shims (Swift/Kotlin)."

[lib]
name = "kal_ffi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
kal-core = { path = "../kal-core" }
kal-import = { path = "../kal-import" }
kal-sync = { path = "../kal-sync" }
kal-update = { path = "../kal-update" }
kal-storage = { path = "../kal-storage" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = "3"
