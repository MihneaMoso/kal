[package]
name = "kal-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Account-free peer-to-peer sync for Kal: CRDT merge, sync-chain keys, encrypted transport."

[dependencies]
kal-core = { path = "../kal-core" }
bip39 = { version = "2", features = ["rand"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

# Live P2P transport (iroh gossip). Native-only: iroh does not support wasm32,
# and the app already gates kal-sync to non-wasm builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = "1"
iroh-gossip = "0.101"
distributed-topic-tracker = "0.3"
ed25519-dalek = "3"
tokio = { workspace = true, features = ["sync"] }
bytes = "1"

[dev-dependencies]
rand = "0.8"
tempfile = "3"
tracing-subscriber = "0.3"
