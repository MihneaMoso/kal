[package]
name = "kal-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dioxus application shell for Kal."

[[bin]]
name = "kal"
path = "src/main.rs"

[dependencies]
kal-core = { path = "../crates/kal-core" }
kal-storage = { path = "../crates/kal-storage" }
kal-import = { path = "../crates/kal-import" }
kal-sync = { path = "../crates/kal-sync" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
tokio = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
dirs-next = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

# Desktop-only deps (gated behind target_os check in source).
[target.'cfg(not(target_os = "android"))'.dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
kal-notify = { path = "../crates/kal-notify", features = ["desktop"] }
rfd = "0.15"
tar = "0.4"
flate2 = "1"

# Android / mobile deps.
[target.'cfg(target_os = "android")'.dependencies]
dioxus = { version = "0.7", features = ["mobile"] }
kal-notify = { path = "../crates/kal-notify" }
kal-ffi = { path = "../crates/kal-ffi" }
# App-private writable data dir resolution.
ndk-context = "0.1"
jni = "0.21"
