name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (dioxus-desktop)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kal-linux
          - os: macos-latest
            artifact: kal-macos
          - os: windows-latest
            artifact: kal-windows.exe
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build release binary
        working-directory: app
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/kal
            target/release/kal.exe

  android-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK + CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Install dx CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash

      - name: Install ImageMagick (launcher icon resizing)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build Android APK
        working-directory: app
        run: |
          dx bundle --android --release --target aarch64-linux-android --package-types apk
          # dx hardcodes template launcher icons; stage our branded ones into
          # the generated Android project's res/, then rebuild with gradle (dx
          # would regenerate the template over our overwrite).
          ../scripts/apply-icons.sh
          # Stage the in-repo home-screen widgets (Kotlin + res + manifest)
          # into the generated Android project so they compile with libmain.so.
          ../scripts/stage-widgets.sh
          # Stage the in-repo self-update support (content provider + intent).
          ../scripts/stage-updater.sh
          # dx writes the generated Android project to the repo-root target/,
          # even when run from app/.
          cd ../target/dx/kal/release/android/app
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kal-android.apk
          path: |
            target/dx/kal/release/android/app/app/build/outputs/apk/debug/*.apk
            target/dx/kal/release/android/app/app/build/outputs/apk/release/*.apk
