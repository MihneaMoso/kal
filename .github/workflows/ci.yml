name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (dioxus-desktop)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Core stays UI-framework-free
        shell: bash
        run: |
          # kal-core/kal-storage/kal-sync/... must never reach for the Dioxus
          # runtime: bridge/JNI threads have no runtime and signals touched from
          # them panic (guide §5.3 / §12.3).
          if git grep -n -e dioxus -- crates/; then
            echo "::error::kal-* crates must not reference the Dioxus runtime"
            exit 1
          fi
      - name: C ABI contract (header vs exports)
        if: runner.os == 'Linux'
        run: |
          cargo build -p kal-ffi
          bash scripts/check-bridge-abi.sh

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kal-linux
          - os: macos-latest
            artifact: kal-macos
          - os: windows-latest
            artifact: kal-windows.exe
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build release binary
        working-directory: app
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/kal
            target/release/kal.exe

  # The Android app (android/): built by Gradle directly. Its native half is the
  # kal-jni/kal-ffi pair, staged by the script a developer runs locally, so the
  # JNI-symbol cross-check and the JVM unit tests gate every push instead of only
  # a developer's machine. The release workflow builds the same project with the
  # stable signing key; here the plain `assembleRelease` proves the release
  # variant compiles (the debug-key fallback signs it locally).
  kotlin-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK + SDK platform
        run: sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"

      # Builds libkal_jni.so for arm64-v8a, stages it into the module's jniLibs
      # and fails if any kotlin.external declaration has no matching export.
      - name: Cross-build the JNI library
        run: bash scripts/build-kotlin-android.sh

      - name: JVM unit tests + debug/release APKs
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload Kotlin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kal-kotlin-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
