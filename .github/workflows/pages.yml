# Deploys the Kal landing page (web/site) and the in-app web build (web/app)
# to GitHub Pages.
#
# The repo is the `kal` project itself, so GitHub Pages for a project site
# publishes at https://mihneamoso.github.io/kal/. We assemble a single staging
# directory so the pages artifact keeps the correct mapping:
#   web/site/* -> https://mihneamoso.github.io/kal/          (landing page)
#   web/app/*  -> https://mihneamoso.github.io/kal/app/      (Dioxus wasm app)
#
# The landing page uses only relative URLs (`css/…`, `icons/…`, `app/`), and
# the app is built with `base_path = "kal/app"` in `app/Dioxus.toml`, so both
# work unchanged under the `/kal/` path prefix.
#
# Setup (one time): Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages artifact (site at root, app at /app)
        run: |
          mkdir -p _deploy/app
          cp -rT web/site _deploy
          cp -rT web/app _deploy/app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
