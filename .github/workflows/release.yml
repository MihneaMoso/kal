# Builds release binaries (desktop + Android APK) and publishes them to a
# GitHub Release. Triggered by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kal-linux
          - os: macos-latest
            artifact: kal-macos
          - os: windows-latest
            artifact: kal-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build release binary
        working-directory: app
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="target/release/kal"
          [ -f "$bin" ] || bin="../target/release/kal"
          [ -f "$bin" ] || bin="target/release/kal.exe"
          [ -f "$bin" ] || bin="../target/release/kal.exe"
          base="kal-${version}-${GITHUB_SHA::8}-${{ matrix.artifact }}"
          if [[ "$bin" == *.exe ]]; then
            cp "$bin" "${base}"
          else
            tar czf "${base}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          fi
        working-directory: app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            app/*.tar.gz
            app/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install NDK + CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Install dx CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash
      - name: Install ImageMagick (launcher icon resizing)
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build Android APK
        working-directory: app
        run: |
          dx bundle --android --release --target aarch64-linux-android --package-types apk
          # dx hardcodes template launcher icons; stage our branded ones into
          # the generated Android project's res/, then rebuild without going
          # through dx (which would regenerate the template over ours).
          ../scripts/apply-icons.sh
          # dx writes the generated Android project to the repo-root target/,
          # even when run from app/.
          cd ../target/dx/kal/release/android/app
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            target/dx/kal/release/android/app/app/build/outputs/apk/debug/*.apk
            target/dx/kal/release/android/app/app/build/outputs/apk/release/*.apk

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kal ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
