# Builds release binaries (desktop + Android APK) and publishes them to a
# GitHub Release. Triggered by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kal-linux
          - os: macos-latest
            artifact: kal-macos
          - os: windows-latest
            artifact: kal-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build release binary
        working-directory: app
        env:
          # Pin the version embedded by app/build.rs to the release tag so the
          # in-app updater compares correctly even if tags aren't fetched.
          KAL_RELEASE_VERSION: ${{ github.ref_name }}
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="target/release/kal"
          [ -f "$bin" ] || bin="../target/release/kal"
          [ -f "$bin" ] || bin="target/release/kal.exe"
          [ -f "$bin" ] || bin="../target/release/kal.exe"
          base="kal-${version}-${GITHUB_SHA::8}-${{ matrix.artifact }}"
          if [[ "$bin" == *.exe ]]; then
            cp "$bin" "${base}"
          else
            tar czf "${base}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          fi
        working-directory: app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            app/*.tar.gz
            app/*.exe

  android:
    # The Kotlin app (android/) is the Android build since the rewrite: this job
    # signs it with the stable release key from the repository secrets
    # (SIGNING.md §3–§4) and publishes the same asset name as before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install NDK + SDK platform
        run: sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"
      - name: Decode the release keystore
        env:
          KAL_KEYSTORE_BASE64: ${{ secrets.KAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KAL_KEYSTORE_BASE64" || {
            echo "::error::KAL_KEYSTORE_BASE64 is not set — refusing to ship an unsigned release (SIGNING.md)"
            exit 1
          }
          echo "$KAL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kal-release.jks"
      - name: Build the signed APK
        env:
          KAL_KEYSTORE_FILE: ${{ runner.temp }}/kal-release.jks
          KAL_KEYSTORE_PASSWORD: ${{ secrets.KAL_KEYSTORE_PASSWORD }}
          KAL_KEY_ALIAS: ${{ secrets.KAL_KEY_ALIAS }}
          KAL_KEY_PASSWORD: ${{ secrets.KAL_KEY_PASSWORD }}
        run: |
          bash scripts/build-kotlin-android.sh \
            --release --apk-release --version "${GITHUB_REF_NAME}"
      - name: Package and verify the APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          version="${GITHUB_REF_NAME#v}"
          cp "$apk" "kal-${version}-android.apk"
          # A release must be signed by the stable key, never the debug
          # fallback: `apksigner` fails on an unsigned APK, and the versionCode
          # must match the tag-derived scheme.
          certs="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            "kal-${version}-android.apk")"
          echo "$certs"
          # The Gradle signing config falls back to the debug key when no
          # keystore is configured; that must never reach a release.
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::release APK is debug-signed — check KAL_KEYSTORE_FILE/aliases"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging \
            "kal-${version}-android.apk" | grep -E "package:|versionCode"
          ls -la "kal-${version}-android.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: kal-*.apk

  # The web app is NOT deployed here: GitHub Pages only accepts deploys from
  # the default branch (the `github-pages` environment protection rules reject
  # tag pushes), and the release tag's commit is already on master, so the
  # pages.yml workflow rebuilds and deploys the wasm bundle from that commit
  # with the same KAL_RELEASE_VERSION. Deploying Pages from tags would be both
  # redundant and forbidden.
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only attach regular files -- gh release create/upload reject directories.
          mapfile -d '' -t assets < <(find dist -type f -print0)
          test "${#assets[@]}" -gt 0 || { echo "no release assets found" >&2; exit 1; }
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kal ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${assets[@]}" \
          || gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
               --clobber --repo "${GITHUB_REPOSITORY}"
