[workspace]
resolver = "2"
members = [
    "crates/chrono-core",
    "crates/chrono-storage",
    "crates/chrono-sync",
    "crates/chrono-notify",
    "crates/chrono-import",
    "crates/chrono-ffi",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
