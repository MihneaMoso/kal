[workspace]
resolver = "2"
members = [
    "crates/kal-core",
    "crates/kal-storage",
    "crates/kal-sync",
    "crates/kal-notify",
    "crates/kal-import",
    "crates/kal-ffi",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep on-disk footprint small (project constraint: builds stay in ./target
# and total workspace size stays under 1 GB):
# - no incremental caches (the single biggest offender),
# - line-tables-only debug info instead of full DWARF,
# - one codegen unit, no parallel artifact duplication.
[profile.dev]
debug = false
incremental = false
opt-level = "z"
strip = true
codegen-units = 16

[profile.test]
debug = false
incremental = false
opt-level = "z"
strip = true
